# THIS `id` IS PERMANENT — see umbrel-app-store.yml. Umbrel treats a change of app id (or of the
# store id it is prefixed with) as uninstall-and-reinstall, and uninstall deletes this app's data
# directory without asking. That directory holds the database AND every backup of it.
#
# EVERY REQUIRED FIELD IS FILLED, as in tenon-joinr-backup/umbrel-app.yml (the required set is
# `REQUIRED_MANIFEST_FIELDS` in getumbrel/umbrel-apps' `.tools/lint-apps.mjs`): manifestVersion,
# id, category, name, version, tagline, description, developer, website, dependencies, repo,
# support, port, gallery, path, submitter, submission.
#
# `manifestVersion: 1`: no lifecycle hooks. The app keeps its own calendar inside the container
# (the 23:00 month-end record and the 02:30 nightly backup).
#
# BUMP `version:` ON EVERY IMAGE CHANGE. Umbrel offers an update only when this field differs from
# the installed one. `pnpm umbrel:release` in the joinr-fin repository writes this line and the
# image line of docker-compose.yml together, and refuses a new image without a new version. It is
# the same version the app shows in its footer and in Settings → About.
manifestVersion: 1
id: tenon-joinr-finance
category: finance
name: Joinr Finance
version: '1.4.0'
tagline: 'Personal wealth tracker: net worth, investments, cash flow, super and FIRE'
# `main`, as tenon-joinr-backup's comment explains: a raw.githubusercontent URL names a branch.
icon: https://raw.githubusercontent.com/devcal1/tenon-umbrel-store/main/tenon-joinr-finance/icon.svg
description: >-
  A self-hosted rebuild of a personal-wealth spreadsheet: net worth, investments, cash and
  budget, side income and dividends, super, property and loans, the monthly history, and a FIRE
  planner. One small web app with its own database, on this server.


  ⚠️ **UNINSTALLING THIS APP DELETES ITS DATABASE AND EVERY BACKUP OF IT.** Umbrel removes an
  app's data directory when the app is uninstalled, without asking, and this app keeps both the
  database and its backups there. Before you uninstall, download the newest backup from
  Settings → Backups, and keep a copy somewhere that is not this server: the weekly copy to the
  NAS (below) does this once it is set up, and uninstalling never touches the copies on the NAS.


  **Backups:** every night at 02:30 the app takes a copy of its database and checks it before
  keeping it. It keeps the newest copy of each of the last 14 days it ran and of each of the last
  12 months, plus copies taken by hand ("Back up now"), before an import, before a restore and
  before an update. Settings → Backups lists them with a download button.


  **Copy to the NAS (optional):** once a week, on Sunday at 03:00, the app copies every backup it
  keeps to an rsync module on a NAS, with a catch-up after downtime and a "Copy to NAS now"
  button. It only adds: nothing on the NAS is ever deleted or changed in place, and each copy is
  proved by listing the NAS back. It is off until two files, the NAS address and its password,
  are placed in this app's data folder over SSH with the `pnpm umbrel:nas-secrets` helper from
  the joinr-fin repository; the page never shows or asks for the address or the password.


  **First run:** open the Import page and upload the workbook export. A dry run shows the
  reconciliation first; nothing is written until you confirm.


  **Time zone:** the month-end record (23:00) and the nightly backup (02:30) use the server time
  zone, `TZ` in this app's docker-compose.yml.


  **Access:** the app has no login of its own. Umbrel's login stays in front of every page, the
  API and the backup downloads, with one exception: the phone app's API under /api/mobile/
  answers anyone on the home network or the tailnet without the Umbrel login. It returns data
  only for a paired phone's key (made in Settings → Phone, removable there; pairing needs a code
  that you open there, valid for 5 minutes) and it never changes anything. The key travels in
  plain HTTP, so the phone should use this server's full Tailscale name (ending in .ts.net). The
  app sits on a private Docker network that only Umbrel's app proxy joins, so other apps on this
  server cannot call it directly.


  **Install the Joinr Registry app first.** This app's image is built on this server and served
  to Umbrel by that app; Install and Update fail while it is stopped.
releaseNotes: >-
  **1.4.0: the phone app can update itself from the Umbrel.** The phone app (1.2.0 and later)
  asks this server for a newer version when it is opened and when you refresh, shows a one-line
  banner on Today, and installs the update only when you tap Install and confirm Android's own
  dialog; it refuses any update not signed with the same key as the app on the phone. An update
  is published from the PC with a helper over SSH (`pnpm android:publish` in the joinr-fin
  repository), which places the APK and its details in this app's data folder (data/apk); the
  server only reads them and has no upload of its own. Settings → Phone shows the version on offer
  and tags each paired phone. The phone app 1.1.0 keeps working unchanged and needs one install of
  1.2.0 from the PC to start updating itself. Nothing changes in the database (no migration), so
  no pre-update backup is taken and going back to 1.3.0 is safe.
developer: Tenon
website: https://github.com/devcal1/joinr-fin
dependencies: []
repo: https://github.com/devcal1/joinr-fin
support: https://github.com/devcal1/joinr-fin/issues
# Checked on 27 Sep 2026 against every `port:` in every app manifest of every app store on this
# device and against the host's TCP listeners: 4932 was free (4930 is the Joinr Registry app,
# 4931 Joinr Backup). The stores refresh every few minutes, so `pnpm umbrel:release` and
# `pnpm umbrel:status` re-check it before every release.
port: 4932
gallery: []
path: ''
defaultUsername: ''
defaultPassword: ''
submitter: Tenon
# As tenon-joinr-backup: a community app has no submission pull request, so this names the
# repository the app is published from.
submission: https://github.com/devcal1/tenon-umbrel-store
# umbrelOS's own Backups (Kopia snapshots of the app-data folder, taken while the app runs) skip
# these: the live database's shared-memory file, and every hidden temporary (backup partials,
# restore staging and upload files, unverified set-asides). A snapshot of the live finance.db and
# its -wal taken while the app writes may be inconsistent: after an Umbrel-level restore, restore
# from the app's own verified copy in data/backups/ with the restore CLI (joinr-fin's
# docs/deploy/RUNBOOK.md, "Restore").
#   data/secrets holds the NAS copy's address and password: umbrelOS Backups must never
# carry the NAS password to wherever those snapshots go. A folder entry excludes the folder and
# everything under it (kopia's ignore file follows gitignore rules; `*` also matches dot-names, so
# the helper's hidden temporaries are covered); the second entry is belt and braces. After an
# Umbrel-level restore, place the files again with `pnpm umbrel:nas-secrets` (the runbook's
# "Copy to the NAS").
#   data/devices holds the paired phones' key hashes: umbrelOS Backups must not bring back a removed
# phone's key after an Umbrel-level restore (a phone removed in Settings → Phone stays removed).
#   data/apk holds the phone app's published APK and its details file: it can be published again
# from the PC at any time (`pnpm android:publish`), and would otherwise add about 6 MB to every
# snapshot.
backupIgnore:
  - data/finance.db-shm
  - data/.*
  - data/backups/.*
  - data/secrets
  - data/secrets/*
  - data/devices
  - data/devices/*
  - data/apk
  - data/apk/*
