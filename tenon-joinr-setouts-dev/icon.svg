<!-- The Joinr mark: the wordmark's full stop on the brand's ink ground. Used where a
     square is required and a 2.45:1 wordmark would be illegible — favicons, the touch icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Joinr">
  <defs>
    <linearGradient id="joinr-mark-spectrum" x1="10" x2="54" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#17C8A0"/><stop offset="0.3" stop-color="#8B5CF6"/><stop offset="0.55" stop-color="#D946EF"/><stop offset="1" stop-color="#F97316"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#101019"/>
  <circle cx="32" cy="32" r="22" fill="url(#joinr-mark-spectrum)"/>
</svg>
