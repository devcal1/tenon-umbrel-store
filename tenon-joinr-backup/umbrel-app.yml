# THIS `id` IS PERMANENT — see umbrel-app-store.yml. Umbrel treats a change of app id (or of the
# store id it is prefixed with) as uninstall-and-reinstall, and uninstall deletes this app's data
# directory without asking. That directory holds every backup.
#
# EVERY REQUIRED FIELD IS FILLED even where a community store would tolerate a blank. umbreld's
# runtime validation of this schema is currently commented out, so a sloppy manifest installs
# today and breaks on the day validation is switched back on. The required set is
# `REQUIRED_MANIFEST_FIELDS` in getumbrel/umbrel-apps' own `.tools/lint-apps.mjs`, read on
# 11 Sep 2026: manifestVersion, id, category, name, version, tagline, description, developer,
# website, dependencies, repo, support, port, gallery, path, submitter, submission.
#
# `manifestVersion: 1` and not 1.1: 1.1 exists for apps that use lifecycle hooks, and this one
# uses none — it keeps its own calendar inside the container, because umbrelOS has no scheduling
# primitive and its hooks are not time-based.
#
# BUMP `version:` ON EVERY IMAGE CHANGE. Umbrel offers an update only when this field differs from
# the installed one, polled about every five minutes. A new image pushed without a bump here
# reaches nobody.
manifestVersion: 1
id: tenon-joinr-backup
category: files
name: Joinr Backup
version: '1.2.0'
tagline: Weekly encrypted backup of the Joinr database and the files customers uploaded
# `main`, not `master` — that is this repository's default branch, and a raw.githubusercontent URL
# names a branch rather than following the default. The first version said `master`, copied from a
# sibling store that uses it, and would have 404'd into a blank tile.
icon: https://raw.githubusercontent.com/devcal1/tenon-umbrel-store/main/tenon-joinr-backup/icon.svg
description: >-
  Takes a weekly encrypted copy of the Joinr production database and of the letterheads customers
  have uploaded to it, and keeps the newest sixteen on this server.


  ⚠️ **UNINSTALLING THIS APP DELETES EVERY BACKUP IT HOLDS.** Umbrel removes an app's data
  directory when the app is uninstalled, without asking, and this app's data directory is where
  the archives live. Download the newest archive from the app's own page before you uninstall it.


  **What one backup contains:** the whole database — organisations, people, quotes, rate cards,
  history, and the sign-in accounts with their passwords — as one `pg_dump` file, plus every
  logo, banner and terms PDF from the app's file storage, which no database backup covers. It is
  a single 7-Zip archive encrypted with AES-256, with the file names encrypted too.


  **The files people attach to quotes are kept beside the archives, not inside them**, in a
  folder of their own where each one is separately encrypted with the same passphrase, and they go
  to the NAS with the archives wherever that copy is set up. They are held that way because an
  attachment is uploaded once and never changed. Every archive lists the ones that existed when it
  was taken and which file holds each one, so restoring everything takes an archive and that
  folder together.


  **The passphrase cannot be recovered.** Not by Tenon, not by Umbrel, not by anybody. It belongs
  in a password manager and on paper.


  **Set-up:** the app needs four credentials placed in its data directory on this server. They are
  put there over SSH by a helper script kept in a private repository, so that no
  password ever travels through a browser or a chat window. Until they are there the app's page
  says which are missing and takes no backup.


  Every backup is proved before it is kept: the database dump is read back with `pg_restore`, and
  the finished archive is opened again with its own passphrase. An archive that fails either check
  is parked under a name this app will never count as a backup, and the page says so.
releaseNotes: >-
  **The files people attach to quotes are now backed up.**


  Joinr lets a shop attach a plan, a drawing or a photo to a quote. Those files are not in the
  weekly archive. They are kept in a folder called `attachments` beside the archives, one
  separately encrypted file per document, and — wherever the copy to the NAS is set up — they go
  across after the archives do. Logos, banners and terms PDFs are still inside the weekly
  archive, exactly as before.


  **They are kept apart because they never change.** A logo gets replaced, so a fresh copy of it
  every week is the right thing to do. An attachment is uploaded once and then stays as it is —
  so putting all of them inside every weekly archive would mean each week's archive growing to
  hold every file ever attached, and the same files being sent up to the NAS again every week.


  **Nothing about a file can be read from its name.** Each one is its own small 7-Zip archive,
  opened with the same passphrase as the backups, named after a fingerprint of what is inside it.
  No job name, no customer name and no file name appears in the folder — and a drawing attached
  to two quotes is stored once rather than twice.


  **Nothing in that folder is ever deleted**, here or on the NAS. The archives are tidied down to
  the newest sixteen every week, as before; the attachments folder is never tidied, so a file
  whose quote was deleted months ago is still there. The copy is checked the same way the
  archives are — once the files are sent, the NAS's own list is read back and counted, rather
  than the transfer being taken at its word.


  **Restoring now takes two things: an archive and that folder.** The instructions inside every
  archive (`README-restore.txt`) have grown to cover both: the two commands to run, and for
  the letterheads a by-hand way through for somebody with no developer tools to hand. (An
  attachment can be opened by hand with the passphrase, but only the command puts one back on a
  quote.) The archive's `manifest.txt`
  lists every attached file the backup saw and which file in the folder holds it — the archive is
  the index, and the folder on its own is meant to be meaningless without it.


  **A shop that has attached nothing sees nothing new on the NAS.** An empty folder sends nothing
  and creates nothing there; the page and the log simply report zero attachments. And if this
  server is ever short of room, the attachments alone are skipped with a sentence saying so — the
  database and the letterheads are still backed up.


  The status page gains an **Attachments** row: how many attached files Joinr holds, how many
  were new this run, and how many files the folder here holds and how big it is. The NAS line
  now says how many of them went across.


  **There is nothing to set up.** Press Update; the app makes the folder itself, and the next
  backup mirrors whatever has been attached.


  ⚠️ **UNINSTALLING THIS APP STILL DELETES EVERY BACKUP IT HOLDS** — and now the attachments
  folder with them, since it sits in the same place. Updating deletes nothing, and neither
  touches the copies on the NAS.
developer: Tenon
website: https://joinr.com.au
