version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: tenon-ajd-design-manager_web_1
      APP_PORT: 3000
      # The app has its own password login (`APP_PASSWORD` below), so Umbrel's login is switched off
      # in front of it, as for tenon-joinr-crosscuts. Umbrel's per-app "Require Umbrel login"
      # toggle must stay off or it puts a second login in front of the first.
      PROXY_AUTH_ADD: "false"

  web:
    # Pinned by tag AND digest. Built and published by devcal1/ajd's docker-publish workflow when
    # an `app-vX.Y.Z` tag is pushed there.
    image: ghcr.io/devcal1/ajd-design-manager:1.2.0@sha256:6f897dfe14092f5d2237395e3dc609affa2e0714ca62cb24f01bb4def64b6a98
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # The password Umbrel generates and displays for this app (the manifest sets
      # `deterministicPassword: true`, which is what makes Umbrel provide `$APP_PASSWORD`; it is NOT
      # the same value as `$APP_SEED`, which 1.0.0 wrongly used here and so never matched what Umbrel
      # showed). It is the sign-in password until someone chooses their own under the app's
      # Settings; after that the app ignores this variable, so updates cannot overwrite it.
      APP_PASSWORD: $APP_PASSWORD
      SESSION_SECRET: $APP_SEED
      # The app's own nightly backup (a consistent SQLite snapshot plus the uploads folder) runs at
      # BACKUP_HOUR local time and keeps BACKUP_RETENTION copies, under data/backups. A container
      # does not inherit the host's timezone, so TZ is set here.
      TZ: "Australia/Sydney"
      BACKUP_HOUR: "2"
      BACKUP_RETENTION: "14"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
